
name: Install YVONNIE2005 project ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'YVONNIE2005-MD-BOT-READY*.zip'

permissions:
  contents: write

jobs:
  install-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name 'YVONNIE2005-MD-BOT-READY*.zip' | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          mkdir -p /tmp/yvonnie
          unzip -q "$ZIP" -d /tmp/yvonnie
          cp -a /tmp/yvonnie/. .
          rm -f YVONNIE2005-MD-BOT-READY*.zip

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/
          if git diff --cached --quiet; then
            echo "No project changes"
            exit 0
          fi
          git commit -m "Install updated YVONNIE2005 bot project"
          git push origin HEAD:main
