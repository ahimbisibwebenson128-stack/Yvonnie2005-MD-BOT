
name: Install YVONNIE2005 project ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'YVONNIE2005-MD-BOT-READY.zip'

permissions:
  contents: write

jobs:
  install-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          set -e
          ZIP="YVONNIE2005-MD-BOT-READY.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found in repository root."
            exit 1
          fi
          mkdir -p /tmp/yvonnie-project
          unzip -q "$ZIP" -d /tmp/yvonnie-project
          cp -a /tmp/yvonnie-project/. .
          rm -f "$ZIP"
          node scripts/check-syntax.js

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install YVONNIE2005 bot project from ZIP"
            git push origin HEAD:main
          fi
